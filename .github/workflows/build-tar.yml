name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Show Node.js and npm versions
        run: |
          echo "Node.js:"
          node --version
          echo "npm:"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package
        run: npm pack

      - name: Show package contents
        run: |
          echo "Generated package:"
          ls -lh *.tgz
          echo
          echo "Package contents:"
          tar -tzf *.tgz

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-nibe-package
          path: "*.tgz"